[project]
name = "cartograph"
version = "0.1.0"
description = "Attack path intelligence: ranks security flaws by what attackers can actually reach"
requires-python = ">=3.11"
dependencies = [
    "falkordb",
    "langgraph",
    "langchain-falkordb[langgraph]",
    "langchain-mcp-adapters",
    "langchain-google-genai",
    "mcp",
    "fastapi",
    "uvicorn",
    "pydantic",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
